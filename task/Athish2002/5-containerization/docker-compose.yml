services:
  web:
    build: .
    container_name: task5_web
    ports:
      - "8000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        # Waits for Redis to answer, not merely to start.
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: task5_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
